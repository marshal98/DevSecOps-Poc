name: Trivy Vulnerable Image Scan

on:
  push:
    branches:
      - dev  # Runs only when code is pushed to 'dev' branch

jobs:
  scan-vulnerable-image:
    name: Scan Vulnerable Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Scan on Vulnerable Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vulnerables/web-dvwa:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: 1  # Fails pipeline if vulnerabilities are found
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Generate JSON Report
        if: always()
        run: |
          trivy image --format json -o trivy-report.json vulnerables/web-dvwa:latest

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.
